name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-api-pivor-central
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: app-api-pivor-central/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint and test
        run: make check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-web-pivor-central
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-web-pivor-central/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
