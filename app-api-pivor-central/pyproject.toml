[project]
name = "app-api-pivor-central"
version = "0.1.0"
description = "API de avaliação de pivô central"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "dishka>=1.4.0,<2",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.6.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "httpx>=0.28.0,<0.29",
    "ruff>=0.8.0,<0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "unit: testes de domínio sem HTTP",
    "integration: API via ASGITransport",
    "e2e: stack completa (Fase 4+)",
    "golden: compara saída com arquivo golden",
]

[tool.ruff]
line-length = 100
target-version = "py312"
